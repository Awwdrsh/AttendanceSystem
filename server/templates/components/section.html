{# SectionTitle with its content. Actions go in `actions` (pass rendered HTML) or put them in the body. #}
<section class="hj-section"{% if id %} id="{{ id }}"{% endif %}>
  {% if title %}
  <div class="hj-section-title">
    <div><h3>{{ title }}</h3>{% if hint %}<p>{{ hint }}</p>{% endif %}</div>
    {% if actions %}<div class="hj-actions">{{ actions }}</div>{% endif %}
  </div>
  {% endif %}
  {{ body }}
</section>
