{# CameraCapture.tsx in a modal; place it inside the form. Open with data-modal-open="{{ id }}". The photo (data URL) goes into hidden input `name`; with submit=True the form is then submitted. #}
<dialog class="hj-modal fullscreen-sm" id="{{ id }}"{% if submit %} data-submit{% endif %} aria-labelledby="{{ id }}-title"
        x-data="hjCamera()" x-init="$el.addEventListener('close', () => stop()); new MutationObserver(() => { if ($el.open && phase !== 'live') start() }).observe($el, { attributes: true, attributeFilter: ['open'] })">
  <div class="hj-modal-head"><div class="hj-modal-title" id="{{ id }}-title">{{ title }}</div>
    <button type="button" class="hj-iconbtn" data-modal-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="hj-modal-body hj-stack">
    <input type="hidden" x-ref="out" name="{{ name }}">
    <div class="hj-camera">
      <video x-ref="video" playsinline muted aria-label="Camera preview" x-show="phase === 'live' || phase === 'starting'"></video>
      <img :src="photo" alt="Your photo" x-show="photo" x-cloak>
      <div class="oval" x-show="phase === 'live'" x-cloak aria-hidden="true"><div></div></div>
      <div class="msg" x-show="phase === 'starting'"><span class="hj-loader" style="border-color:#e8ecef;border-right-color:transparent"></span></div>
      <div class="msg" x-show="phase === 'unavailable' && !photo" x-cloak><i class="ti ti-camera-off" style="font-size:28px" aria-hidden="true"></i>Camera not available</div>
    </div>
    <div class="hj-alert hj-tone-warn" x-show="problem" x-cloak><i class="ti ti-alert-triangle" aria-hidden="true"></i><div x-text="problem"></div></div>
    <p class="hj-small hj-muted" style="margin:0" x-text="phase === 'captured' ? 'Happy with it? Your photo is encrypted, seen only by you, your manager and HR, and deleted automatically after the retention period.' : 'Center your face in the oval. Only this one photo is taken; the camera turns off right after.'"></p>
    <input type="file" x-ref="file" accept="image/*" capture="user" hidden @change="fromFile($event)">
    <div class="hj-row hj-between">
      <button type="button" class="hj-btn default" x-show="phase === 'captured'" @click="start()"><i class="ti ti-refresh" aria-hidden="true"></i>Retake</button>
      <button type="button" class="hj-btn subtle gray" x-show="phase !== 'captured'" @click="$refs.file.click()"><i class="ti ti-upload" aria-hidden="true"></i>Use phone camera</button>
      <button type="button" class="hj-btn" x-show="phase === 'captured' && photo" x-cloak @click="confirm()"><i class="ti ti-camera" aria-hidden="true"></i>{{ confirm_label }}</button>
      <button type="button" class="hj-btn" x-show="!(phase === 'captured' && photo)" :disabled="phase !== 'live'" @click="snap()"><i class="ti ti-camera" aria-hidden="true"></i>Take photo</button>
    </div>
    {% if footer %}{{ footer }}{% endif %}
  </div>
</dialog>
