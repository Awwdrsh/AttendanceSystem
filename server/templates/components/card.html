<div class="hj-card p-{{ padding|default:'lg' }}{% if cls %} {{ cls }}{% endif %}"{% if id %} id="{{ id }}"{% endif %}>
  {% if title %}<div class="hj-card-head"><div><div class="hj-card-title">{{ title }}</div>{% if hint %}<div class="hj-card-hint">{{ hint }}</div>{% endif %}</div>{% if actions %}<div class="hj-actions">{{ actions }}</div>{% endif %}</div>{% endif %}
  {{ body }}
</div>
