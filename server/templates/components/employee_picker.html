{# EmployeePicker.tsx: searchable; options "Name (code)" come from /_/web/employees/search over HTMX. #}
<div class="hj-fieldset hj-combo" x-data="hjCombo({ value: '{{ value|escapejs }}', label: '{{ selected_label|escapejs }}' })" @click.outside="open = false">
  {% if label %}<label class="hj-label" for="{{ id }}">{{ label }}{% if required %}<span class="req" aria-hidden="true">*</span>{% endif %}</label>{% endif %}
  <input type="hidden" name="{{ name }}" x-ref="input" :value="value" value="{{ value }}"{% if required %} required{% endif %}>
  <div class="hj-input-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input id="{{ id }}" x-ref="search" class="hj-input" type="text" autocomplete="off" placeholder="{{ placeholder }}" role="combobox" aria-autocomplete="list"
           aria-controls="{{ id }}-list" :aria-expanded="open" value="{{ selected_label }}" :value="label" name="q"
           hx-get="/_/web/employees/search?status={{ status }}" hx-trigger="input changed delay:250ms, focus once" hx-target="#{{ id }}-list" hx-swap="innerHTML" hx-sync="this:replace"
           @input="open = true; value = ''" @focus="open = true" @keydown="keys($event)"{% if error %} aria-invalid="true"{% endif %}>
    <button type="button" class="hj-iconbtn hj-input-right" style="width:24px;height:24px" x-show="value" x-cloak @click="clear()" aria-label="Clear"><i class="ti ti-x" aria-hidden="true" style="font-size:14px"></i></button>
  </div>
  <ul class="hj-combo-list" id="{{ id }}-list" role="listbox" x-show="open" x-cloak @click="if ($event.target.closest('[data-option]')) { const o = $event.target.closest('[data-option]'); choose(o.dataset.id, o.dataset.label) }"></ul>
  {% if error %}<div class="hj-error">{{ error }}</div>{% endif %}
</div>
