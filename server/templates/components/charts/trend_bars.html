{# Kpi.tsx TrendBars: daily bars, days with no work are a short grey tick so gaps read as "no work day". #}
<div class="hj-card">
  <div class="hj-row hj-between" style="align-items:flex-start;margin-bottom:12px">
    <div><div class="hj-strong hj-sm">{{ c.label }}</div><div class="hj-small hj-muted">{{ c.range }}</div></div>
    {% if c.avg %}<div class="hj-right"><div class="hj-small hj-muted">Average</div><div class="hj-strong num">{{ c.avg }}</div></div>{% endif %}
  </div>
  <svg class="hj-chart" viewBox="0 0 {{ c.w }} {{ c.h }}" width="100%" height="{{ c.h }}" role="img" aria-label="{{ c.label }}" preserveAspectRatio="none">
    {% for t in c.ticks %}<line x1="{{ c.left }}" x2="{{ c.w }}" y1="{{ t.y }}" y2="{{ t.y }}" class="grid"/><text x="{{ c.left|add:'-8' }}" y="{{ t.ty }}" text-anchor="end" style="font-size:11px">{{ t.label }}</text>{% endfor %}
    {% for b in c.bars %}<rect class="mark" x="{{ b.x }}" y="{{ b.y }}" width="{{ b.w }}" height="{{ b.h }}" rx="{% if b.empty %}1{% else %}3{% endif %}" fill="{% if b.empty %}var(--hj-line){% else %}var(--hj-hydro){% endif %}"{% if not b.empty and not b.last %} opacity="0.78"{% endif %} data-tip="{{ b.title }}"/>{% endfor %}
    {% for l in c.labels %}<text x="{{ l.x }}" y="{{ c.label_y }}" text-anchor="middle" style="font-size:11px">{{ l.label }}</text>{% endfor %}
  </svg>
</div>
