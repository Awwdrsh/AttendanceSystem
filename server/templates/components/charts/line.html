<div class="hj-chart">
  <svg viewBox="0 0 {{ c.w }} {{ c.h }}" width="100%" role="img" aria-label="{{ c.aria_label }}">
    {% for t in c.ticks %}<line x1="{{ c.left }}" x2="{{ c.right_x }}" y1="{{ t.y }}" y2="{{ t.y }}" class="{% if t.zero %}axis{% else %}grid{% endif %}"/><text x="{{ c.left|add:'-6' }}" y="{{ t.ty }}" text-anchor="end">{{ t.label }}</text>{% endfor %}
    {% for l in c.lines %}
      {% for d in l.segments %}<path d="{{ d }}" fill="none" stroke="{{ l.color }}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>{% endfor %}
      {% for p in l.points %}<circle class="mark" cx="{{ p.cx }}" cy="{{ p.cy }}" r="4" fill="{{ l.color }}" stroke="var(--hj-surface)" stroke-width="2" data-tip="{{ p.title }}"/>{% endfor %}
    {% endfor %}
    {% for x in c.labels %}<text x="{{ x.x }}" y="{{ c.label_y }}" text-anchor="middle">{{ x.label }}</text>{% endfor %}
  </svg>
  {% if c.legend|length > 1 %}<div class="hj-legend">{% for l in c.legend %}<span style="--c:{{ l.color }}">{{ l.label }}</span>{% endfor %}</div>{% endif %}
</div>
