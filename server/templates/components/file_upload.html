{# FileUpload.tsx: pick a PDF or image, upload it straight away, keep the stored file id in `name`. #}
<div class="hj-fieldset" x-data="hjUpload({ value: '{{ value|escapejs }}', filename: '{{ filename|escapejs }}', url: '{{ upload_url|escapejs }}', purpose: '{{ purpose|escapejs }}' })">
  <input type="hidden" name="{{ name }}" x-ref="input" :value="id" value="{{ value }}"{% if required %} required{% endif %}>
  <input type="file" x-ref="file" accept="{{ accept }}" hidden @change="upload($event)">
  <div class="hj-file" x-show="id" x-cloak>
    <i class="ti ti-paperclip" aria-hidden="true"></i><span class="hj-truncate" style="max-width:260px" x-text="filename"></span>
    <button type="button" class="hj-btn subtle gray xs" @click="remove()"><i class="ti ti-x" aria-hidden="true"></i>Remove</button>
  </div>
  <div x-show="!id">
    <button type="button" class="hj-btn default sm" :class="busy && 'is-busy'" @click="pick()"><i class="ti ti-paperclip" aria-hidden="true"></i>{{ label }}</button>
  </div>
</div>
