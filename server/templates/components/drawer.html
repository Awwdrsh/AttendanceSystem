<dialog class="hj-drawer {{ size|default:'' }}" id="{{ id }}" aria-labelledby="{{ id }}-title">
  <div class="hj-modal-head"><div class="hj-modal-title" id="{{ id }}-title">{{ title }}</div>
    <button type="button" class="hj-iconbtn" data-modal-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="hj-modal-body" id="{{ id }}-body">{{ body }}</div>
</dialog>
