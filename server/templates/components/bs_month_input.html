{# BsMonthPicker: payroll and statutory periods by their BS month names, e.g. "Ashwin 2083". #}
<div class="hj-fieldset">
  {% if label %}<span class="hj-label">{{ label }}</span>{% endif %}
  <div class="hj-row nowrap hj-gap-sm">
    <select class="hj-select" name="{{ name_month }}" aria-label="Month (BS)" style="width:140px">
      {% for i, m in months %}<option value="{{ i }}"{% if i == month %} selected{% endif %}>{{ m }}</option>{% endfor %}
    </select>
    <select class="hj-select" name="{{ name_year }}" aria-label="Year (BS)" style="width:100px">
      {% for y in years %}<option value="{{ y }}"{% if y == year %} selected{% endif %}>{{ y }}</option>{% endfor %}
    </select>
  </div>
</div>
