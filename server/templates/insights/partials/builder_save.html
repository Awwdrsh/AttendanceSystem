{# SaveModal: name, description and sharing for the current definition. #}
<form class="hj-form" data-modal-title="{% if current %}Save report{% else %}Save as a new report{% endif %}" hx-post="{% url 'insights:builder_save' %}"
      hx-target="this" hx-swap="outerHTML" x-data="{ name: {{ name|json_attr }} }">
  <input type="hidden" name="definition" value="{{ definition }}">
  <input type="hidden" name="current_id" value="{{ current.id|default:'' }}">
  <label class="hj-fieldset"><span class="hj-label">Name <span class="req">*</span></span>
    <input class="hj-input" name="name" maxlength="120" required x-model="name" autofocus></label>
  <label class="hj-fieldset"><span class="hj-label">Description</span>
    <textarea class="hj-input" name="description" maxlength="500" rows="2">{{ description }}</textarea></label>
  <label class="hj-row nowrap hj-gap-xs hj-sm"><input type="checkbox" class="hj-switch" name="shared" value="1"{% if shared %} checked{% endif %}>Share with the other HR users</label>
  <div class="hj-modal-foot">
    {% if current %}<button type="submit" class="hj-btn default" name="as_new" value="1" :disabled="!name.trim()">Save as new</button>{% endif %}
    <button type="submit" class="hj-btn" :disabled="!name.trim()">Save</button>
  </div>
</form>
