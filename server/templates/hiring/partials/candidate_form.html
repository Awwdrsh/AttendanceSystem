<form class="hj-form" data-modal-title="Add a candidate" data-modal-size="lg" hx-post="{% url 'hiring:candidate_new' job.id %}" hx-swap="none"
      x-data="{ name: '', email: '' }">
  <p class="hj-sm hj-muted" style="margin:0">For referrals and CVs that reached you directly. If the job has required screening questions, the candidate should apply through the careers page instead.</p>
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="ac-name">Full name<span class="req" aria-hidden="true">*</span></label><input id="ac-name" class="hj-input" name="name" maxlength="120" required x-model="name"></div>
    <div class="hj-fieldset"><label class="hj-label" for="ac-email">E-mail<span class="req" aria-hidden="true">*</span></label><input id="ac-email" class="hj-input" type="email" name="email" maxlength="200" required x-model="email"></div>
    <div class="hj-fieldset"><label class="hj-label" for="ac-phone">Phone</label><input id="ac-phone" class="hj-input" name="phone" maxlength="30"></div>
    <div class="hj-fieldset"><label class="hj-label" for="ac-src">Source</label>
      <select id="ac-src" class="hj-select" name="source"><option value="referral">Referral</option><option value="job_board">Job board</option><option value="manual">Direct</option><option value="other">Other</option></select></div>
    <div class="hj-fieldset"><label class="hj-label" for="ac-exp">Years of experience</label><input id="ac-exp" class="hj-input" type="number" min="0" max="60" step="0.1" name="experienceYears"></div>
    <div class="hj-fieldset"><label class="hj-label" for="ac-emp">Current employer</label><input id="ac-emp" class="hj-input" name="currentEmployer" maxlength="120"></div>
  </div>
  <div class="hj-fieldset"><label class="hj-label" for="ac-notes">Notes</label><textarea id="ac-notes" class="hj-input" name="coverNote" rows="2" maxlength="4000"></textarea></div>
  {% file_upload "cvFileId" "hiring_cv" label="Attach CV (PDF)" accept="application/pdf" %}
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="name.trim().length < 2 || !/^\S+@\S+\.\S+$/.test(email)">Add candidate</button></div>
</form>
