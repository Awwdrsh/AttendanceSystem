<div class="hj-row nowrap hj-gap-xs hj-end">
  {% if row.status == 'open' %}<button type="button" class="hj-iconbtn" aria-label="Copy link to this job" data-tip="Copy link to this job" data-copy="{{ row.careers_url }}"><i class="ti ti-copy" aria-hidden="true"></i></button>{% endif %}
  {% if row.hr %}
  <div style="position:relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape="open = false">
    <button type="button" class="hj-iconbtn" aria-label="Actions for {{ row.title }}" aria-haspopup="menu" @click="open = !open"><i class="ti ti-dots" aria-hidden="true"></i></button>
    <div class="hj-menu down" role="menu" x-show="open" x-cloak @click="open = false">
      <button type="button" class="hj-menu-item" role="menuitem" hx-get="{% url 'hiring:job_edit' row.id %}" hx-target="#hj-drawer-body" hx-swap="innerHTML" hx-push-url="false">Edit</button>
      {% if row.status != 'open' %}<button type="button" class="hj-menu-item" role="menuitem" hx-post="{% url 'hiring:job_publish' row.id %}" hx-swap="none" hx-push-url="false">Publish</button>{% endif %}
      {% if row.status == 'open' %}<a class="hj-menu-item" role="menuitem" href="{{ row.careers_url }}" target="_blank" rel="noopener">View on careers page</a>
      <button type="button" class="hj-menu-item danger" role="menuitem" hx-post="{% url 'hiring:job_close' row.id %}" hx-swap="none" hx-push-url="false">Close</button>{% endif %}
    </div>
  </div>
  {% endif %}
</div>
