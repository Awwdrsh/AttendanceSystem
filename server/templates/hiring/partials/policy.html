<form class="hj-form" data-modal-title="Hiring settings" hx-post="{% url 'hiring:policy' %}" hx-swap="none">
  <label class="hj-row nowrap hj-gap-sm" style="align-items:flex-start">
    <input type="checkbox" class="hj-switch" name="careersEnabled" value="1"{% if p.careersEnabled %} checked{% endif %}>
    <span><span class="hj-sm hj-strong">Public careers page</span><span class="hj-help" style="display:block">Open jobs are listed at /careers and anyone can apply.</span></span>
  </label>
  <div class="hj-fieldset">
    <label class="hj-label" for="hp-ret">Keep data of candidates who were not selected for (days)</label>
    <div class="hj-help">After this, their name, contact details, CV and answers are deleted automatically. Hired candidates are kept.</div>
    <input id="hp-ret" class="hj-input" type="number" name="retentionDays" min="30" max="1095" value="{{ p.retentionDays }}">
  </div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Save</button></div>
</form>
