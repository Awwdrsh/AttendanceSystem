<div class="hj-row nowrap hj-gap-xs hj-end">
  {% if row.can_job %}<button type="button" class="hj-btn light xs" hx-get="{% url 'hiring:job_new' %}?requisition={{ row.id }}" hx-target="#hj-drawer-body" hx-swap="innerHTML" hx-push-url="false">Create job</button>{% endif %}
  {% if row.can_cancel %}<button type="button" class="hj-btn subtle danger xs" hx-post="{% url 'hiring:requisition_cancel' row.id %}" hx-swap="none" hx-push-url="false">Cancel</button>{% endif %}
</div>
