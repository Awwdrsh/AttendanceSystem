<form class="hj-form" data-modal-title="Schedule an interview" data-modal-size="lg" hx-post="{% url 'hiring:interview_new' app.id %}" hx-swap="none"
      x-data="{ mode: 'in_person', time: '11:00', panel: ['{{ me }}'] }" @hj:hiring-done.window="$el.closest('dialog') && $el.closest('dialog').close()">
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="iv-title">Title</label><input id="iv-title" class="hj-input" name="title" maxlength="80" value="Interview"></div>
    <div class="hj-fieldset"><label class="hj-label" for="iv-mode">How</label>
      <select id="iv-mode" class="hj-select" name="mode" x-model="mode"><option value="in_person">In person</option><option value="video">Video call</option><option value="phone">Phone</option></select></div>
    {% bs_date_input "date" value=date label="Date" required=True min=today %}
    <div class="hj-form-row">
      <div class="hj-fieldset"><label class="hj-label" for="iv-time">Time (Nepal)<span class="req" aria-hidden="true">*</span></label><input id="iv-time" class="hj-input" type="time" name="time" required x-model="time"></div>
      <div class="hj-fieldset"><label class="hj-label" for="iv-min">Minutes</label><input id="iv-min" class="hj-input" type="number" name="durationMin" min="10" max="480" step="15" value="45"></div>
    </div>
  </div>
  <div class="hj-fieldset"><label class="hj-label" for="iv-loc" x-text="mode === 'video' ? 'Meeting link' : mode === 'phone' ? 'Who calls whom' : 'Where'">Where</label>
    <input id="iv-loc" class="hj-input" name="location" maxlength="300"></div>
  <div class="hj-fieldset"><span class="hj-label">Panel</span><div class="hj-help">Each panel member is notified and fills in a scorecard.</div>
    <div class="hj-stack hj-gap-xs" style="max-height:180px;overflow:auto;border:1px solid var(--hj-line);border-radius:8px;padding:8px">
      {% for u in users %}<label class="hj-row nowrap hj-gap-xs"><input type="checkbox" class="hj-check" name="panel" value="{{ u.id }}" x-model="panel" :disabled="panel.length >= 10 && !panel.includes('{{ u.id }}')"><span class="hj-sm">{{ u.name }}</span></label>{% endfor %}
    </div></div>
  <label class="hj-row nowrap hj-gap-sm"><input type="checkbox" class="hj-switch" name="notifyCandidate" value="1" checked><span class="hj-sm">E-mail the invitation to the candidate</span></label>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!/^\d{2}:\d{2}$/.test(time) || panel.length === 0">Schedule</button></div>
</form>
