{# approval_chain_live: ApprovalChainPreview.tsx inside a request form; values are read from the form when it has the fields. #}
<div id="{{ id }}" class="wf-chain-slot"
     hx-get="{{ url }}?object_type={{ object_type|urlencode }}"
     hx-trigger="load, input delay:300ms from:closest form, change delay:300ms from:closest form, hj:chain-{{ object_type }} from:body delay:300ms"
     hx-vals='js:{employee_id: ((document.getElementById("{{ id|escapejs }}").closest("form") || {elements: {}}).elements["{{ employee_field|escapejs }}"] || {value: "{{ employee_id|escapejs }}"}).value, amount: ((document.getElementById("{{ id|escapejs }}").closest("form") || {elements: {}}).elements["{{ amount_field|escapejs }}"] || {value: "{{ amount|escapejs }}"}).value}'
     hx-sync="this:replace" hx-swap="innerHTML"><div class="hj-skeleton" style="height:44px"></div></div>
