<form class="hj-form" data-modal-title="Reject request" hx-post="{% url 'workflow:reject' id %}" hx-swap="none" x-data="{ reason: '' }">
  <p class="hj-sm hj-muted" style="margin:0">{{ name }} will see your reason.</p>
  <div class="hj-fieldset">
    <label class="hj-label" for="wf-reason">Reason<span class="req" aria-hidden="true">*</span></label>
    <div class="hj-help">At least 3 characters.</div>
    <textarea id="wf-reason" name="reason" class="hj-input" rows="2" maxlength="1000" required x-model="reason" autofocus></textarea>
  </div>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn danger" :disabled="reason.trim().length < 3"><i class="ti ti-x" aria-hidden="true"></i>Reject request</button>
  </div>
</form>
