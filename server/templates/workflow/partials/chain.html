{# ApprovalChainPreview.tsx: who approves, step by step, with routing notes. #}
<div class="hj-card p-sm wf-chain" style="background:var(--hj-line-soft)">
  <div class="hj-row nowrap hj-gap-xs" style="align-items:flex-start">
    <i class="ti ti-route" aria-hidden="true"></i>
    <div class="hj-stack" style="--gap:4px;min-width:0">
      <div class="hj-small hj-muted hj-strong">Approved by</div>
      <div class="hj-row hj-gap-xs">
        {% for s in steps %}{% if not forloop.first %}<i class="ti ti-arrow-right hj-muted" aria-hidden="true"></i>{% endif %}<span class="hj-sm">{{ s.text }}</span>{% endfor %}
      </div>
      {% if notes %}<div class="hj-row nowrap hj-gap-xs"><i class="ti ti-alert-triangle hj-warn-text" aria-hidden="true"></i><span class="hj-small hj-muted">{{ notes }}.</span></div>{% endif %}
    </div>
  </div>
</div>
