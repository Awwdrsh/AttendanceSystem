{# ArrivalsRibbon.tsx: include with r = hajiri.punch.ribbon.arrivals_ribbon(...) #}
<div>
  <div style="position:relative;height:{{ r.height }}px;border-bottom:1px solid var(--hj-line)">
    <div style="position:absolute;left:{{ r.start_left }}%;width:{{ r.grace_width }}%;top:0;bottom:0;background:var(--hj-hydro-soft);border-left:1.5px solid var(--hj-hydro)"></div>
    {% for m in r.marks %}<div data-tip="{{ m.tip }}" style="position:absolute;left:calc({{ m.left }}% + 1px);bottom:{{ m.bottom }}px;width:9px;height:9px;border-radius:2px;background:var(--hj-{% if m.late %}warn{% else %}hydro{% endif %})"></div>{% endfor %}
  </div>
  <div style="position:relative;height:20px">{% for h in r.hours %}<span class="hj-small hj-muted num" style="position:absolute;left:{{ h.left }}%;transform:translateX(-50%);top:4px">{{ h.label }}</span>{% endfor %}</div>
  <div class="hj-row hj-gap-lg" style="margin-top:6px">
    <span class="hj-row nowrap hj-gap-xs"><span style="width:9px;height:9px;border-radius:2px;background:var(--hj-hydro)"></span><span class="hj-small hj-muted">On time</span></span>
    <span class="hj-row nowrap hj-gap-xs"><span style="width:9px;height:9px;border-radius:2px;background:var(--hj-warn)"></span><span class="hj-small hj-muted">Late</span></span>
    <span class="hj-row nowrap hj-gap-xs"><span style="width:10px;height:10px;background:var(--hj-hydro-soft);border-left:1.5px solid var(--hj-hydro)"></span><span class="hj-small hj-muted">Shift start {{ r.shift_start }} and grace</span></span>
  </div>
</div>
