<form class="hj-form" data-modal-title="{% if code in existing_codes %}New structure version{% else %}New salary structure{% endif %}" hx-post="{% url 'payroll:structure_new' %}" hx-swap="none"
      x-data="{ code: '{{ code|escapejs }}', name: '{{ name_en|escapejs }}', existing: {{ existing_codes|json_attr }}, n: {{ picked|length }} }"
      @change="n = $el.querySelectorAll('[name=components]:checked').length">
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="st-code">Code<span class="req" aria-hidden="true">*</span></label>
      <input class="hj-input" id="st-code" name="code" maxlength="20" required x-model="code" @input="code = code.toUpperCase()"></div>
    <div class="hj-fieldset"><label class="hj-label" for="st-name">Name<span class="req" aria-hidden="true">*</span></label>
      <input class="hj-input" id="st-name" name="name_en" required x-model="name"></div>
  </div>
  <div class="hj-fieldset"><span class="hj-label">Components</span><div class="hj-help">In payslip order.</div>
    <div class="hj-row hj-gap-sm">{% for c in components %}<label class="hj-check-label"><input type="checkbox" class="hj-check" name="components" value="{{ c }}"{% if c in picked %} checked{% endif %}> <span class="mono hj-small">{{ c }}</span></label>{% endfor %}</div></div>
  <p class="hj-small hj-muted" style="margin:0" x-show="existing.includes(code)" x-cloak>A structure with this code exists, so this saves as its next version.</p>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn" :disabled="!code || !name || !n">Save structure</button></div>
</form>
