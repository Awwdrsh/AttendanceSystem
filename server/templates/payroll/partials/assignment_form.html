<form class="hj-form" data-modal-title="Assign salary structure" data-modal-size="lg" hx-post="{% url 'payroll:assignment_new' %}" hx-swap="none">
  <div class="hj-form-row">
    {% employee_picker "employee_id" value=employee_id required=True %}
    <div class="hj-fieldset"><label class="hj-label" for="as-ver">Structure version<span class="req" aria-hidden="true">*</span></label>
      <select class="hj-select" id="as-ver" name="structure_version_id" required hx-get="{% url 'payroll:assignment_amounts' %}" hx-target="#as-amounts" hx-trigger="change">
        <option value="">Choose a version</option>{% for v in versions %}<option value="{{ v.id }}">{{ v.label }}</option>{% endfor %}</select></div>
    {% bs_date_input "from" value=today label="Effective from" required=True %}
  </div>
  <div id="as-amounts">{% include "payroll/partials/assignment_amounts.html" with codes=None %}</div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Assign salary</button></div>
</form>
