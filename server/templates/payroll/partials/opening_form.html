<form class="hj-form" data-modal-title="Opening balance" data-modal-size="lg" hx-post="{% url 'payroll:opening_edit' %}" hx-swap="none" x-data="{ emp: '{{ v.employee_id }}' }" @change="emp = $el.querySelector('[name=employee_id]').value">
  <input type="hidden" name="fy" value="{{ fy }}">
  <div class="hj-form-row">
    {% employee_picker "employee_id" value=v.employee_id status="all" required=True %}
    <div class="hj-fieldset"><label class="hj-label" for="ob-src">Source</label>
      <select class="hj-select" id="ob-src" name="source">{% for k, l in sources %}<option value="{{ k }}"{% if k == v.source %} selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    {% for k, label, hint, val in nums %}<div class="hj-fieldset"><label class="hj-label" for="ob-{{ k }}">{{ label }}</label>{% if hint %}<div class="hj-help">{{ hint }}</div>{% endif %}
      <input class="hj-input" id="ob-{{ k }}" name="{{ k }}" type="number" min="0" step="0.01" value="{{ val }}"></div>{% endfor %}
    <div class="hj-fieldset"><label class="hj-label" for="ob-months">Months</label><div class="hj-help">Months of pay included</div>
      <input class="hj-input" id="ob-months" name="months" type="number" min="0" max="12" value="{{ v.months }}"></div>
    {% for k, label, hint, val in rets %}<div class="hj-fieldset"><label class="hj-label" for="ob-{{ k }}">{{ label }}</label><div class="hj-help">{{ hint }}</div>
      <input class="hj-input" id="ob-{{ k }}" name="{{ k }}" type="number" min="0" step="0.01" value="{{ val }}"></div>{% endfor %}
  </div>
  <label class="hj-check-label"><input type="checkbox" class="hj-check" name="festival_paid"{% if v.festival_paid %} checked{% endif %}> Festival allowance (Dashain) already paid this year</label>
  <div class="hj-fieldset"><label class="hj-label" for="ob-note">Note</label><input class="hj-input" id="ob-note" name="note" maxlength="500" value="{{ v.note|default:'' }}" placeholder="Optional, e.g. previous employer's name"></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn" :disabled="!emp">Save</button></div>
</form>
