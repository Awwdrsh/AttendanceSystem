<form class="hj-form" data-modal-title="Add one-time input" hx-post="{% url 'payroll:input_new' run_id %}" hx-swap="none" x-data="{ amt: '', emp: '' }" @change="emp = $el.querySelector('[name=employee_id]').value">
  {% employee_picker "employee_id" required=True %}
  <div class="hj-fieldset"><label class="hj-label" for="in-code">Component</label>
    <select class="hj-select" id="in-code" name="component_code">{% for c in components %}<option value="{{ c.code }}"{% if c.code == 'ALLOWANCE' %} selected{% endif %}>{{ c.code }}, {{ c.name_en }} ({{ c.type }})</option>{% endfor %}</select></div>
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="in-amt">Amount (NPR)<span class="req" aria-hidden="true">*</span></label><div class="hj-help">Up to 2 decimals.</div>
      <input class="hj-input" id="in-amt" name="amount" placeholder="0.00" inputmode="decimal" required x-model="amt"></div>
    <div class="hj-fieldset"><label class="hj-label" for="in-note">Note</label><input class="hj-input" id="in-note" name="note" maxlength="200"></div>
  </div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn" :disabled="!emp || !/^\d+(\.\d{1,2})?$/.test(amt)">Add input</button></div>
</form>
