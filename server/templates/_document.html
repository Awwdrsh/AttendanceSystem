{% load static %}<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#12773a">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hajiri">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"defaultSwapStyle":"innerHTML","responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true}]}'>
  <title>{% block title %}{% if page_title %}{{ page_title }} · {% endif %}Hajiri · CoreValley{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="{% static 'vendor/tabler/tabler-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/hajiri.css' %}">
  {% block head %}{% endblock %}
  <script src="{% static 'js/theme.js' %}"></script>
  <script src="{% static 'vendor/htmx/htmx.min.js' %}" defer></script>
  <script src="/_/web/bs-calendar.js" defer></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
  <script src="{% static 'vendor/alpine/alpine.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' {% if hj_user %}data-user-id="{{ hj_user.id }}"{% endif %} {% if not debug_mode %}data-sw{% endif %} {% if hj_offline_flush_url %}data-offline-flush-url="{{ hj_offline_flush_url }}"{% endif %} {% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
<div class="hj-toasts" id="hj-toasts" aria-live="polite"></div>
{% if hj_flash %}<script type="application/json" id="hj-flash">{{ hj_flash|to_json }}</script>{% endif %}
<dialog class="hj-modal sm" id="hj-confirm" aria-labelledby="hj-confirm-title">
  <div class="hj-modal-head"><div class="hj-modal-title" id="hj-confirm-title">Are you sure?</div>
    <button type="button" class="hj-iconbtn" id="hj-confirm-cancel-x" data-modal-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="hj-modal-body">
    <p class="hj-sm" id="hj-confirm-msg"></p>
    <div class="hj-modal-foot"><button type="button" class="hj-btn default" id="hj-confirm-cancel">Cancel</button><button type="button" class="hj-btn danger" id="hj-confirm-ok">Confirm</button></div>
  </div>
</dialog>
<dialog class="hj-modal" id="hj-modal" aria-labelledby="hj-modal-title">
  <div class="hj-modal-head"><div class="hj-modal-title" id="hj-modal-title"></div>
    <button type="button" class="hj-iconbtn" data-modal-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="hj-modal-body" id="hj-modal-body"></div>
</dialog>
<dialog class="hj-drawer" id="hj-drawer" aria-labelledby="hj-drawer-title">
  <div class="hj-modal-head"><div class="hj-modal-title" id="hj-drawer-title"></div>
    <button type="button" class="hj-iconbtn" data-modal-close aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <div class="hj-modal-body" id="hj-drawer-body"></div>
</dialog>
</body>
</html>
