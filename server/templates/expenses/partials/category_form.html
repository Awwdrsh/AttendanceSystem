<form class="hj-form" data-modal-title="{% if cat %}{{ cat.name }}{% else %}New category{% endif %}" data-modal-size="lg"
      hx-post="{% if cat %}{% url 'expenses:category_edit' cat.id %}{% else %}{% url 'expenses:category_new' %}{% endif %}" hx-swap="none"
      x-data="{ kind: '{{ cat.kind|default:'amount' }}' }">
  <div class="hj-form-row">
    {% if not cat %}<div class="hj-fieldset"><label class="hj-label">Code<span class="req" aria-hidden="true">*</span></label><div class="hj-help">Capital letters, digits and _</div>
      <input class="hj-input mono" name="code" maxlength="30" required @input="$el.value = $el.value.toUpperCase()"></div>{% endif %}
    <div class="hj-fieldset"><label class="hj-label">Name<span class="req" aria-hidden="true">*</span></label><input class="hj-input" name="name" maxlength="80" required value="{{ cat.name|default:'' }}"></div>
    <div class="hj-fieldset"><label class="hj-label">Claimed as</label>
      <select class="hj-select" name="kind" x-model="kind"><option value="amount">An amount</option><option value="mileage">Distance (km × rate)</option></select></div>
    <div class="hj-fieldset" x-show="kind === 'amount'"><label class="hj-label">Receipt needed above (NPR)</label><div class="hj-help">0 = always; empty = never</div>
      <input class="hj-input" name="receipt_required_above" inputmode="decimal" value="{{ cat.receiptRequiredAbove|default:'' }}"></div>
  </div>
  {% if cat %}<label class="hj-check-label"><input type="checkbox" class="hj-switch" name="active"{% if cat.active %} checked{% endif %}> Employees can choose this category</label>{% endif %}
  <div class="hj-strong hj-sm hj-mt-sm">Limits by grade</div>
  <div class="hj-small hj-muted">Grade * applies to every grade without its own row. Leave a limit empty for no limit.</div>
  <div class="hj-stack" id="limit-rows" style="--gap:6px">{% for l in limits %}{% include "expenses/partials/limit_row.html" %}{% endfor %}</div>
  <button type="button" class="hj-btn subtle sm" style="align-self:flex-start" hx-get="{% url 'expenses:limit_row' %}" hx-target="#limit-rows" hx-swap="beforeend"
          hx-vals='js:{taken: [...document.querySelectorAll("#limit-rows [name=limit_grade]")].map(s => s.value)}'><i class="ti ti-plus" aria-hidden="true"></i>Add a limit</button>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Save</button></div>
</form>
