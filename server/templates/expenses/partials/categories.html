<div class="hj-table-wrap"><div class="hj-table-scroll"><table class="hj-table">
  <thead><tr><th>Category</th><th>Claimed as</th><th>Receipt</th><th>Limits</th></tr></thead>
  <tbody>
  {% for c in categories %}
    <tr class="clickable" hx-get="{% url 'expenses:category_edit' c.id %}" hx-target="#hj-modal-body" hx-trigger="click">
      <td><span class="hj-row nowrap hj-gap-xs"><span class="hj-sm hj-strong">{{ c.name }}</span>{% if not c.active %}{% badge "Hidden" "idle" %}{% endif %}</span><div class="hj-small hj-muted mono">{{ c.code }}</div></td>
      <td>{{ c.kind_text }}</td><td>{{ c.receipt_text }}</td><td class="muted">{{ c.limits_text }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table></div></div>
