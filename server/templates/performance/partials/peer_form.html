<form class="hj-form" data-modal-title="Feedback for {{ req.employee_name }}" hx-post="{% url 'performance:peer_respond' req.id %}" hx-swap="none" x-data="{ r: '', labels: { {% for n, l in levels %}'{{ n }}': '{{ n }} · {{ l|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %} } }"
      @change="r = ($el.querySelector('input[name=rating]:checked') || {}).value || ''">
  <p class="hj-sm hj-muted" style="margin:0">{{ req.cycle_name }}. Shared anonymously, combined with other colleagues' answers.</p>
  <div class="hj-sm" style="font-weight:500">Overall</div>
  {% include "performance/partials/rating_picker.html" with name="rating" value=None %}
  <div class="hj-small hj-muted" x-show="r" x-cloak x-text="labels[r]"></div>
  <div class="hj-fieldset"><label class="hj-label" for="pf-s">What do they do well?</label><textarea class="hj-input" id="pf-s" name="strengths" rows="2" maxlength="2000"></textarea></div>
  <div class="hj-fieldset"><label class="hj-label" for="pf-i">What could they do better?</label><textarea class="hj-input" id="pf-i" name="improvements" rows="2" maxlength="2000"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button class="hj-btn" type="submit" :disabled="!r" disabled>Send feedback</button></div>
</form>
