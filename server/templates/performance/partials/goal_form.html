{% load perf_tags %}
<form class="hj-form" data-modal-title="New goal" data-modal-size="lg" hx-post="{% url 'performance:goal_new' %}" hx-swap="none"
      x-data="{ scope: 'individual', krs: [] }">
  <input type="hidden" name="for" value="{{ mode }}">
  {% if mode == 'company' %}
  <div class="hj-pills" role="tablist">
    <button type="button" class="hj-pill" :aria-selected="scope === 'individual'" @click="scope = 'individual'">Person</button>
    <button type="button" class="hj-pill" :aria-selected="scope === 'department'" @click="scope = 'department'">Department</button>
    <button type="button" class="hj-pill" :aria-selected="scope === 'company'" @click="scope = 'company'">Company</button>
  </div>
  {% endif %}
  <input type="hidden" name="scope" :value="scope" value="individual">
  {% if mode == 'team' %}
  <div class="hj-fieldset" x-show="scope === 'individual'"><label class="hj-label" for="g-emp">For</label>
    <select class="hj-select" id="g-emp" name="employee_id"><option value="">Myself</option>{% for e in employees %}<option value="{{ e.id }}"{% if e.id == default_employee %} selected{% endif %}>{{ e.name_en }}{% if e.designation %}, {{ e.designation }}{% endif %}</option>{% endfor %}</select></div>
  {% endif %}
  {% if mode == 'company' %}
  <div class="hj-fieldset" x-show="scope === 'department'" x-cloak><label class="hj-label" for="g-dept">Department<span class="req">*</span></label>
    <select class="hj-select" id="g-dept" name="org_unit_id" :required="scope === 'department'"><option value=""></option>{% for d in departments %}<option value="{{ d.id }}">{{ d.name_en }}</option>{% endfor %}</select></div>
  {% endif %}
  <div class="hj-fieldset"><label class="hj-label" for="g-title">Goal<span class="req">*</span></label>
    <input class="hj-input" id="g-title" name="title" required maxlength="200" placeholder="e.g. Cut month-end close to 3 days"></div>
  <div class="hj-fieldset"><label class="hj-label" for="g-desc">Why it matters</label><textarea class="hj-input" id="g-desc" name="description" maxlength="4000" rows="2"></textarea></div>
  <div class="hj-form-row">
    {% bs_date_input "due_date" label="Due date" %}
    <div class="hj-fieldset"><label class="hj-label" for="g-w">Weight in review (%)</label><input class="hj-input" id="g-w" name="weight" type="number" min="0" max="100" step="any"></div>
  </div>
  <div class="hj-fieldset"><label class="hj-label" for="g-parent">Supports (optional)</label>
    <select class="hj-select" id="g-parent" name="parent_id"><option value=""></option>{% for p in parents %}<option value="{{ p.id }}">{% if p.scope == 'company' %}Company{% else %}{{ p.org_unit_name|default:"Department" }}{% endif %}: {{ p.title }}</option>{% endfor %}</select></div>
  <div class="hj-strong hj-sm">Key results</div>
  <template x-for="(k, i) in krs" :key="i">
    <div class="hj-card p-sm hj-stack" style="--gap:6px">
      <div class="hj-row nowrap" style="align-items:flex-end">
        <div class="hj-fieldset hj-grow"><label class="hj-label">Key result</label><input class="hj-input" name="kr_title" x-model="k.title" placeholder="e.g. Close in 3 working days" maxlength="200"></div>
        <button type="button" class="hj-iconbtn" aria-label="Remove key result" @click="krs.splice(i, 1)"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      <div class="hj-form-row" style="--cols:4">
        <div class="hj-fieldset"><label class="hj-label">Measure</label><select class="hj-select" name="kr_measure" x-model="k.measure">
          <option value="number">Number</option><option value="percent">Percent</option><option value="currency">Amount (NPR)</option><option value="boolean">Done / not done</option></select></div>
        <div class="hj-fieldset" x-show="k.measure !== 'boolean'"><label class="hj-label">Start</label><input class="hj-input" type="number" step="any" name="kr_start" x-model="k.start"></div>
        <div class="hj-fieldset" x-show="k.measure !== 'boolean'"><label class="hj-label">Target</label><input class="hj-input" type="number" step="any" name="kr_target" x-model="k.target"></div>
        <div class="hj-fieldset" x-show="k.measure === 'number'"><label class="hj-label">Unit</label><input class="hj-input" name="kr_unit" x-model="k.unit" placeholder="days" maxlength="20"></div>
      </div>
    </div>
  </template>
  <button type="button" class="hj-btn default" @click="krs.push({ title: '', measure: 'number', start: 0, target: 100, unit: '' })"><i class="ti ti-plus" aria-hidden="true"></i>Add key result</button>
  <div class="hj-small hj-muted">Without key results, progress is updated by hand at each check-in.</div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button class="hj-btn" type="submit">Save goal</button></div>
</form>
