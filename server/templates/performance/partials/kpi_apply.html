{% load perf_tags %}
<form class="hj-form" data-modal-title="Add from the KPI library" hx-post="{% url 'performance:kpi_apply' %}" hx-swap="none"
      x-data="{ k: '', info: {{ kpi_info|json_attr }} }">
  {% if employee %}<input type="hidden" name="employee_id" value="{{ employee }}">{% endif %}
  {% if not kpis %}<p class="hj-sm hj-muted">HR has not added KPIs yet.</p>{% else %}
  <div class="hj-fieldset"><label class="hj-label" for="k-id">KPI<span class="req">*</span></label>
    <select class="hj-select" id="k-id" name="kpi_id" required x-model="k"><option value=""></option>{% for k in kpis %}<option value="{{ k.id }}">{{ k.title }}{% if k.designation %} ({{ k.designation }}){% endif %}</option>{% endfor %}</select></div>
  <p class="hj-sm hj-muted" style="margin:0" x-show="k && info[k] && info[k].d" x-cloak x-text="k && info[k] ? info[k].d : ''"></p>
  {% endif %}
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="k-t">Target</label><input class="hj-input" id="k-t" name="target" type="number" step="any" :placeholder="k && info[k] ? info[k].t : ''"></div>
    <div class="hj-fieldset"><label class="hj-label" for="k-w">Weight (%)</label><input class="hj-input" id="k-w" name="weight" type="number" min="0" max="100" step="any"></div>
  </div>
  {% bs_date_input "due_date" label="Due date" %}
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button class="hj-btn" type="submit"{% if not kpis %} disabled{% endif %}>Add goal</button></div>
</form>
