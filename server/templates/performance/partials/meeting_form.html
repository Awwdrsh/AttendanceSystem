<form class="hj-form" data-modal-title="Schedule a 1-on-1" hx-post="{% url 'performance:meeting_new' %}" hx-swap="innerHTML">
  <div class="hj-fieldset"><label class="hj-label" for="mt-with">With<span class="req">*</span></label>
    <select class="hj-select" id="mt-with" name="with_employee_id" required><option value=""></option>{% for p in people %}<option value="{{ p.id }}">{{ p.name_en }} ({{ p.rel }})</option>{% endfor %}</select></div>
  <div class="hj-form-row">
    {% bs_date_input "date" value=date label="Date" required=True %}
    <div class="hj-fieldset"><label class="hj-label" for="mt-time">Time<span class="req">*</span></label><input class="hj-input" id="mt-time" name="time" type="time" value="11:00" required></div>
  </div>
  <div class="hj-fieldset"><label class="hj-label" for="mt-cad">Repeats</label><select class="hj-select" id="mt-cad" name="cadence">
    <option value="none">One-off</option><option value="weekly">Weekly</option><option value="biweekly" selected>Every 2 weeks</option><option value="monthly">Monthly</option></select></div>
  <div class="hj-fieldset"><label class="hj-label" for="mt-ag">Agenda</label><div class="hj-help">One topic per line</div><textarea class="hj-input" id="mt-ag" name="agenda" rows="3"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button class="hj-btn" type="submit">Schedule</button></div>
</form>
