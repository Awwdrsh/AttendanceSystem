<form class="hj-form" data-modal-title="{% if holiday %}Edit holiday{% else %}New holiday{% endif %}"
      hx-post="{% if holiday %}{% url 'shifts:holiday_edit' holiday.id %}{% else %}{% url 'shifts:holiday_new' %}{% endif %}" hx-target="this" hx-swap="outerHTML">
  {% form_errors form %}
  {{ form.name_ne }}
  {% bs_date_input "local_date" value=form.local_date.value label="Date" required=True error=form.local_date.errors.0 %}
  {% form_field form.name_en %}
  {% form_field form.gender_scope %}
  {% form_field form.optional %}
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn">Save holiday</button>
  </div>
</form>
