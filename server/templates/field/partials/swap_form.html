<form class="hj-form" data-modal-title="Swap a shift" hx-post="{% url 'field:swap_new' %}" hx-swap="none" x-data="{ col: '' }">
  <div hx-get="{% url 'field:swap_new' %}" hx-trigger="change" hx-include="this" hx-target="#hj-modal-body">
    {% bs_date_input "date" value=date label="Day" required=True min=min max=max %}
  </div>
  <p class="hj-sm hj-muted" style="margin:0">You are on {{ mine }}.</p>
  <label class="hj-fieldset"><span class="hj-label">Swap with</span>
    <select class="hj-select" name="colleague_id" x-model="col">
      <option value="">{% if colleagues %}Choose a colleague{% else %}No colleague on a different shift that day{% endif %}</option>
      {% for c in colleagues %}<option value="{{ c.id }}">{{ c.label }}</option>{% endfor %}
    </select></label>
  <label class="hj-fieldset"><span class="hj-label">Reason</span>
    <textarea class="hj-input" name="reason" rows="2" maxlength="500" placeholder="Optional">{{ reason }}</textarea></label>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!col">Send request</button>
  </div>
</form>
