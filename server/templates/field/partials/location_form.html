<form class="hj-form" data-modal-title="{% if id %}Edit location{% else %}Add location{% endif %}" data-modal-size="lg" hx-post="{% if id %}{% url 'field:location_edit' id %}{% else %}{% url 'field:location_new' %}{% endif %}" hx-swap="none"
      x-data="{ name: '{{ loc.name|escapejs }}', lat: '{{ loc.lat }}', lng: '{{ loc.lng }}' }">
  <label class="hj-fieldset"><span class="hj-label">Name <span class="req">*</span></span>
    <input class="hj-input" name="name" maxlength="80" placeholder="Head office" required x-model="name" value="{{ loc.name }}"></label>
  <label class="hj-fieldset"><span class="hj-label">Address</span>
    <input class="hj-input" name="address" maxlength="300" placeholder="Street, city" value="{{ loc.address|default:'' }}"></label>
  <label class="hj-fieldset"><span class="hj-label">Branch</span>
    <select class="hj-select" name="branch_id"><option value="">All branches</option>{% for b in branches %}<option value="{{ b.id }}"{% if b.id == loc.branch_id %} selected{% endif %}>{{ b.name_en }}</option>{% endfor %}</select>
    <span class="hj-help">Leave empty to use it for every branch.</span></label>
  <div class="hj-form-row" style="--cols:3">
    <label class="hj-fieldset"><span class="hj-label">Latitude <span class="req">*</span></span><input class="hj-input" id="loc-lat" name="lat" type="number" step="0.000001" min="-90" max="90" required x-model="lat" value="{{ loc.lat }}"></label>
    <label class="hj-fieldset"><span class="hj-label">Longitude <span class="req">*</span></span><input class="hj-input" id="loc-lng" name="lng" type="number" step="0.000001" min="-180" max="180" required x-model="lng" value="{{ loc.lng }}"></label>
    <label class="hj-fieldset"><span class="hj-label">Radius (m)</span><input class="hj-input" name="radius_m" type="number" min="20" max="5000" value="{{ loc.radius_m }}"></label>
  </div>
  <div class="hj-row hj-between hj-gap-sm">
    <button type="button" class="hj-btn default sm" data-geo-fill="loc-lat,loc-lng"><i class="ti ti-current-location" aria-hidden="true"></i>Use my current location</button>
    <a class="hj-sm" x-show="lat !== '' && lng !== ''" :href="'https://www.openstreetmap.org/?mlat=' + Number(lat).toFixed(6) + '&mlon=' + Number(lng).toFixed(6) + '#map=17/' + Number(lat).toFixed(6) + '/' + Number(lng).toFixed(6)" target="_blank" rel="noopener noreferrer"><i class="ti ti-map-pin" aria-hidden="true"></i>Check on the map</a>
  </div>
  <label class="hj-switch"><input type="checkbox" name="active"{% if loc.active %} checked{% endif %}><span>Active</span></label>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!name.trim() || lat === '' || lng === ''">Save</button>
  </div>
</form>
