{% load static %}
<form class="hj-form" data-modal-title="Start a field visit" data-geo hx-post="{% url 'field:visit_start' %}" hx-swap="none"
      x-data="{ place: '', camera: false }" @hj:visit-photo-required.window="document.getElementById('visit-camera').showModal()">
  <script src="{% static 'field/geo.js' %}" defer></script>
  <input type="hidden" name="lat"><input type="hidden" name="lng"><input type="hidden" name="accuracy">
  <label class="hj-fieldset"><span class="hj-label">Where are you? <span class="req">*</span></span>
    <input class="hj-input" name="place" maxlength="160" placeholder="Client or place name" required x-model="place"></label>
  <label class="hj-fieldset"><span class="hj-label">Purpose</span>
    <textarea class="hj-input" name="purpose" rows="2" maxlength="500" placeholder="For example: product demo, site inspection"></textarea></label>
  <p class="hj-small hj-muted" style="margin:0">Your location is recorded when the visit starts and ends.{% if first_clocks_in %} Your first visit today also clocks you in.{% endif %}</p>
  {% camera_capture name="photo" title="Photo at the visit" confirm_label="Start visit" id="visit-camera" submit=True %}
  <div class="hj-modal-foot hj-between">
    <button type="button" class="hj-btn subtle gray" :disabled="!place.trim()" data-modal-open="visit-camera"><i class="ti ti-camera" aria-hidden="true"></i>Add a photo</button>
    <button type="submit" class="hj-btn" :disabled="!place.trim()">{% if photo_required %}Continue{% else %}Start visit{% endif %}</button>
  </div>
</form>
