{% load static %}
<form class="hj-form" data-modal-title="{% if place %}End visit to {{ place }}{% else %}End visit{% endif %}" data-geo hx-post="{% url 'field:visit_end' id %}" hx-swap="none">
  <script src="{% static 'field/geo.js' %}" defer></script>
  <input type="hidden" name="lat"><input type="hidden" name="lng"><input type="hidden" name="accuracy">
  <label class="hj-fieldset"><span class="hj-label">Outcome</span>
    <textarea class="hj-input" name="outcome" rows="2" maxlength="1000" placeholder="What happened? For example: order placed, follow-up next week"></textarea></label>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn">End visit</button>
  </div>
</form>
