<form class="hj-form" data-modal-title="Change closing day" hx-post="{% url 'engage:survey_extend' s.id %}" hx-swap="none">
  <p class="hj-sm hj-muted" style="margin:0">{{ s.title }}. Questions and anonymity stay as they are.</p>
  {% bs_date_input "closes_on" value=s.closesOn label="Closes" required=True min=today %}
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Save</button></div>
</form>
