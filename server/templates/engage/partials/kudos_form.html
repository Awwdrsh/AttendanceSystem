{# Composers.tsx KudosComposer #}
<form class="hj-form" data-modal-title="Give kudos" data-modal-size="lg" hx-post="{% url 'engage:kudos_new' %}" hx-swap="none"
      x-data="{ q: '', picked: {{ preset|json_attr }}, message: '', names: {{ names|json_attr }} }">
  <div class="hj-fieldset">
    <label class="hj-label" for="kd-search">Who are you thanking?<span class="req" aria-hidden="true">*</span></label>
    <input id="kd-search" type="search" class="hj-input" placeholder="Search colleagues" x-model="q" autocomplete="off">
    <div class="hj-stack" style="--gap:2px;max-height:200px;overflow:auto;margin-top:6px;border:1px solid var(--hj-line);border-radius:8px;padding:6px">
      {% for p in people %}
      <label class="hj-check" x-show="!q || {{ p.name|lower|json_attr }}.includes(q.toLowerCase())">
        <input type="checkbox" name="recipient_ids" value="{{ p.id }}" x-model="picked" :disabled="picked.length >= 10 && !picked.includes('{{ p.id }}')">
        <span>{{ p.name }}{% if p.designation %} · {{ p.designation }}{% endif %}</span>
      </label>
      {% endfor %}
      <span class="hj-sm hj-muted" x-show="!names.some(n => !q || n.includes(q.toLowerCase()))"{% if people %} x-cloak{% endif %}>Nobody matches that name</span>
    </div>
    <div class="hj-help" x-text="picked.length ? picked.length + ' picked' : ''"></div>
  </div>
  {% if values %}
  <fieldset class="hj-fieldset" style="border:0;padding:0;margin:0">
    <legend class="hj-label">Which value did they show? <span class="hj-muted">(optional)</span></legend>
    <div class="hj-row" style="gap:6px">
      <label class="hj-check"><input type="radio" name="value_id" value="" checked><span>None</span></label>
      {% for v in values %}<label class="hj-check"><input type="radio" name="value_id" value="{{ v.id }}"><span>{{ v.emoji }} {{ v.name }}</span></label>{% endfor %}
    </div>
  </fieldset>
  {% endif %}
  <div class="hj-fieldset"><label class="hj-label" for="kd-msg">Message<span class="req" aria-hidden="true">*</span></label>
    <textarea id="kd-msg" name="message" class="hj-input" rows="3" maxlength="1000" required x-model="message" placeholder="Say what they did and why it mattered"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!picked.length || message.trim().length < 3">Send kudos</button></div>
</form>
