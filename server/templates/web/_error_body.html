<div class="hj-error-page">
  <div class="hj-error-code">ERROR {{ status }}</div>
  <h1 style="margin-top:10px">{{ title }}</h1>
  <p class="hj-muted hj-mt-sm">{{ message }}</p>
  <div class="hj-row hj-mt-lg" style="justify-content:center">
    <a class="hj-btn" href="/"><i class="ti ti-home" aria-hidden="true"></i>Go home</a>
    {% if not hj_user %}<a class="hj-btn default" href="/login">Sign in</a>{% endif %}
  </div>
</div>
