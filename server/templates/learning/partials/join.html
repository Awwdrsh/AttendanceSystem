{% load perf_tags %}
<form class="hj-form" data-modal-title="Join {{ c.title }}" hx-post="{% url 'learning:join' c.id %}" hx-swap="none">
  {% if sessions %}
  <div class="hj-fieldset"><label class="hj-label" for="j-s">Session</label><select class="hj-select" id="j-s" name="session_id"><option value=""></option>
    {% for x in sessions %}<option value="{{ x.id }}"{% if x.capacity is not None and x.taken >= x.capacity %} disabled{% endif %}>{{ x.starts_at|short_dt }}{% if x.venue %}, {{ x.venue }}{% endif %}{% if x.capacity %} ({{ x.left }} seats left){% endif %}</option>{% endfor %}</select></div>
  {% endif %}
  {% if c.cost|numstr != '0' %}<p class="hj-sm hj-muted" style="margin:0">Cost to the company: {{ c.cost|npr }}</p>{% endif %}
  <div class="hj-fieldset"><label class="hj-label" for="j-r">Why this course?</label><textarea class="hj-input" id="j-r" name="reason" rows="2" maxlength="1000"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button class="hj-btn" type="submit">Send request</button></div>
</form>
