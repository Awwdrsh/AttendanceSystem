{# Setup: response times (helpdesk.policy). #}
<form class="hj-card p-lg hj-form" style="max-width:640px" hx-post="{% url 'helpdesk:settings' %}" hx-swap="none">
  <div class="hj-section-title" style="margin-top:0"><div><h3>Response times</h3><p>Hours from raising a ticket to resolving it. Tickets past their due time are escalated to HR.</p></div></div>
  <div class="hj-grid" style="--cols:4">
    {% for k, label in priorities %}
    <div class="hj-fieldset"><label class="hj-label" for="sla-{{ k }}">{{ label }}</label>
      <div class="hj-row nowrap hj-gap-xs"><input id="sla-{{ k }}" class="hj-input num" type="number" name="sla_{{ k }}" min="1" max="720" step="1" required value="{{ policy.slaHours|get_item:k }}"><span class="hj-small hj-muted">h</span></div></div>
    {% endfor %}
  </div>
  <div class="hj-grid" style="--cols:2">
    <div class="hj-fieldset"><label class="hj-label" for="auto-close">Close resolved tickets after (days)</label>
      <input id="auto-close" class="hj-input num" type="number" name="auto_close_days" min="1" max="60" step="1" required value="{{ policy.autoCloseDays }}"></div>
    <div class="hj-fieldset"><label class="hj-label" for="reopen-days">Requester can reopen within (days)</label>
      <input id="reopen-days" class="hj-input num" type="number" name="reopen_days" min="0" max="60" step="1" required value="{{ policy.reopenDays }}"></div>
  </div>
  <div class="hj-row hj-end"><button type="submit" class="hj-btn">Save</button></div>
</form>
