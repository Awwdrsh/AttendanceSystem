<form class="hj-form" data-modal-title="Reject overtime" hx-post="{% url 'ot:slip_reject' s.id %}" hx-target="this" hx-swap="outerHTML"
      x-data="{ reason: '{{ reason|default:''|escapejs }}' }">
  <p class="hj-sm hj-muted" style="margin:0">{{ s.name_en }}, {{ s.local_date|bs_date_long }}. The employee will see your reason.</p>
  <div class="hj-fieldset">
    <label class="hj-label" for="ot-reason">Reason<span class="req" aria-hidden="true">*</span></label>
    <div class="hj-help">At least 3 characters.</div>
    <textarea id="ot-reason" name="reason" class="hj-input" rows="2" maxlength="500" required x-model="reason" autofocus{% if form.reason.errors %} aria-invalid="true"{% endif %}>{{ reason|default:'' }}</textarea>
    {% if form.reason.errors %}<div class="hj-error">{{ form.reason.errors.0 }}</div>{% endif %}
  </div>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn danger" :disabled="reason.trim().length < 3"><i class="ti ti-x" aria-hidden="true"></i>Reject overtime</button>
  </div>
</form>
