<form class="hj-form" data-modal-title="Approve overtime" hx-post="{% url 'ot:slip_approve' s.id %}" hx-target="this" hx-swap="outerHTML"
      x-data="{ m: '{{ value|default:0|escapejs }}' }">
  <p class="hj-sm hj-muted" style="margin:0">{{ s.name_en }}, {{ s.local_date|bs_date_long }}. Detected {{ s.detected_min|minutes_hm }}.</p>
  {% if form %}{% form_errors form %}{% endif %}
  <div class="hj-fieldset">
    <label class="hj-label" for="ot-approved-min">Approved minutes</label>
    <div class="hj-help">Cannot exceed the detected minutes or the 4 h daily cap.</div>
    <input id="ot-approved-min" name="approved_min" type="number" class="hj-input" min="0" max="{{ cap }}" step="15" value="{{ value|default:'' }}" x-model.number="m"{% if form.approved_min.errors %} aria-invalid="true"{% endif %}>
    {% if form.approved_min.errors %}<div class="hj-error">{{ form.approved_min.errors.0 }}</div>{% endif %}
  </div>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn"><i class="ti ti-check" aria-hidden="true"></i><span x-text="'Approve ' + (function (n) { n = Math.floor(Number(n) || 0); var h = Math.floor(n / 60), r = n % 60; return h > 0 ? (r > 0 ? h + ' h ' + r + ' m' : h + ' h') : r + ' m'; })(m)">Approve {{ value|default:0|minutes_hm }}</span></button>
  </div>
</form>
