<div id="my-devices" class="hj-stack hj-gap-sm" hx-get="{% url 'relations:my_devices' %}" hx-trigger="hj:refresh-my-devices from:body" hx-target="this" hx-swap="outerHTML">
  {% for d in devices %}
  <div class="hj-card p-sm"><div class="hj-row nowrap hj-between">
    <div><div class="hj-sm hj-strong">{{ d.label }}</div><div class="hj-small hj-muted">Registered {{ d.requested_at|relative_time }}{% if d.last_used_at %}, last clock-in {{ d.last_used_at|relative_time }}{% endif %}</div></div>
    <div class="hj-row nowrap hj-gap-xs">{% badge d.status_label d.status_tone %}
      <button type="button" class="hj-btn subtle gray xs" hx-post="{% url 'relations:device_remove' d.id %}" hx-swap="none">Remove</button></div>
  </div></div>
  {% empty %}
    {% empty_state title="No devices yet" compact=True %}
  {% endfor %}
</div>
