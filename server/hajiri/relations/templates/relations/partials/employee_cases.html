<div id="relations-cases" hx-get="{% url 'relations:employee_section' employee_id %}" hx-trigger="hj:refresh-relations-cases from:body" hx-target="this" hx-swap="outerHTML">
  {% if cases %}
  <div class="hj-card p-sm"><div class="hj-stack hj-gap-xs">
    {% for k in cases %}
    <div class="hj-row hj-between" style="cursor:pointer" hx-get="{% url 'relations:case' k.id %}" hx-target="#hj-drawer-body">
      <span class="hj-sm">D-{{ k.number }}, {{ k.category_label }} on {{ k.incidentDate|bs_date }}{% if k.stageName %}: {{ k.stageName }}{% endif %}</span>{% badge k.status_label k.status_tone %}</div>
    {% endfor %}
  </div></div>
  {% else %}<div class="hj-sm hj-muted">No cases.</div>{% endif %}
</div>
