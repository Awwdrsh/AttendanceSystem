<form class="hj-form" data-modal-title="Ask employees to review their records" data-modal-size="lg" hx-post="{% url 'relations:kye_new' %}" hx-swap="none"
      x-data="{ title: 'Annual record check', aud: 'all', branch: '', unit: '', n: {{ chosen|length }} }">
  <div class="hj-fieldset"><label class="hj-label" for="kye-title">Title<span class="req" aria-hidden="true">*</span></label>
    <input id="kye-title" name="title" class="hj-input" maxlength="160" required x-model="title"></div>
  <div class="hj-fieldset"><label class="hj-label" for="kye-message">Message (optional)</label><textarea id="kye-message" name="message" class="hj-input" rows="2" maxlength="2000"></textarea></div>
  <fieldset class="hj-fieldset"><legend class="hj-label">Sections to review</legend>
    <div class="hj-row hj-gap-md hj-mt-sm" @change="n = $el.querySelectorAll('input:checked').length">
      {% for k, l in sections %}<label class="hj-check"><input type="checkbox" name="sections" value="{{ k }}"{% if k in chosen %} checked{% endif %}> {{ l }}</label>{% endfor %}
    </div></fieldset>
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label" for="kye-aud">Who</label><select id="kye-aud" name="audienceKind" class="hj-select" x-model="aud">
      <option value="all">Everyone</option><option value="branch">One branch</option><option value="department">One department</option></select></div>
    <div class="hj-fieldset" x-show="aud === 'branch'" x-cloak><label class="hj-label" for="kye-branch">Branch</label><select id="kye-branch" name="branchId" class="hj-select" x-model="branch"><option value="">Choose</option>
      {% for b in branches %}<option value="{{ b.id }}">{{ b.name_en }}</option>{% endfor %}</select></div>
    <div class="hj-fieldset" x-show="aud === 'department'" x-cloak><label class="hj-label" for="kye-unit">Department</label><select id="kye-unit" name="orgUnitId" class="hj-select" x-model="unit"><option value="">Choose</option>
      {% for u in units %}<option value="{{ u.id }}">{{ u.name_en }}</option>{% endfor %}</select></div>
  </div>
  {% bs_date_input "dueDate" value=due label="Confirm by" required=True min=today id="kye-due" %}
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!title.trim() || !n || (aud === 'branch' && !branch) || (aud === 'department' && !unit)">Send</button></div>
</form>
