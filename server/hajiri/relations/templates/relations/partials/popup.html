{# PopupNotices (Layout.tsx): one notice at a time, once per person, or until they confirm reading it. #}
<dialog id="hj-popup-notices" class="hj-modal lg" data-static aria-labelledby="hj-popup-title"
        x-data="{ ack: false }" x-init="$el.showModal()"
        @cancel.prevent="{% if not p.requiresAck %}$refs.dismiss.click(){% endif %}">
  <div class="hj-modal-head"><div class="hj-modal-title" id="hj-popup-title">{{ p.title }}</div>
    {% if not p.requiresAck %}<button type="button" class="hj-iconbtn" aria-label="Close" @click="$refs.dismiss.click()"><i class="ti ti-x" aria-hidden="true"></i></button>{% endif %}</div>
  <form class="hj-modal-body hj-stack hj-gap-md" hx-post="{% url 'relations:popup_dismiss' p.id %}" hx-target="#hj-popup-notices" hx-swap="outerHTML">
    <div class="hj-small hj-muted">{{ p.authorName }}, {{ p.createdAt|relative_time }}</div>
    <div class="hj-sm" style="white-space:pre-wrap">{{ p.body }}</div>
    {% if p.requiresAck %}
      <input type="hidden" name="acknowledge" value="1">
      <label class="hj-check"><input type="checkbox" x-model="ack"> I have read and understood this notice</label>
    {% endif %}
    <div class="hj-row hj-end"><button type="submit" x-ref="dismiss" class="hj-btn"{% if p.requiresAck %} :disabled="!ack"{% endif %}>{% if p.requiresAck %}Confirm{% else %}Got it{% endif %}</button></div>
  </form>
</dialog>
