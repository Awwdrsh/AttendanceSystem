<div class="hj-card p-0" id="setup-steps">
  <div class="hj-row hj-between hj-gap-md" style="padding:16px 24px;border-bottom:1px solid var(--hj-line)">
    <span class="hj-sm num" style="font-weight:500">{{ done }} of {{ total }} steps done</span>
    <div class="hj-progress" style="width:220px;max-width:100%" role="progressbar" aria-label="Setup progress" aria-valuenow="{{ pct }}" aria-valuemin="0" aria-valuemax="100"><div style="width:{{ pct }}%"></div></div>
  </div>
  {% for s in steps %}
  <div style="padding:16px 24px{% if not forloop.first %};border-top:1px solid var(--hj-line-soft){% endif %}">
    <div class="hj-row hj-between hj-gap-md">
      <div class="hj-row nowrap hj-gap-md" style="align-items:flex-start;flex:1 1 360px;min-width:0">
        {% if s.done %}
          <span class="hj-step-dot done" aria-label="Done" style="flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--hj-hydro-soft);color:var(--hj-hydro)"><i class="ti ti-check" aria-hidden="true"></i></span>
        {% else %}
          <span class="num" style="flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;{% if s.is_next %}background:var(--hj-hydro);color:#fff{% else %}background:var(--hj-line-soft);color:var(--hj-muted){% endif %}">{{ s.n }}</span>
        {% endif %}
        <div style="min-width:0">
          <div class="hj-sm{% if s.done %} hj-muted{% endif %}" style="font-weight:500">{{ s.title }}</div>
          <div class="hj-sm hj-muted">{{ s.detail }}</div>
        </div>
      </div>
      <div class="hj-row hj-gap-xs">
        {% if s.auto and not s.done %}<button type="button" class="hj-btn xs{% if not s.is_next %} default{% endif %}" hx-post="{% url 'home:setup_action' s.auto.action %}" hx-target="#setup-steps" hx-swap="outerHTML">{{ s.auto.label }}</button>{% endif %}
        <a class="hj-btn subtle xs" href="{{ s.go }}">{{ s.cta }}<i class="ti ti-chevron-right" aria-hidden="true"></i></a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
