{# AvatarEditor.tsx: profile photo with change and remove. self: the signed-in employee's own photo. #}
<div class="hj-row nowrap hj-gap-md" id="avatar-editor-{{ p.id }}">
  {% include "people/partials/avatar.html" with pid=p.id name=p.name_en has=p.has_avatar size=64 v=v %}
  <form class="hj-row hj-gap-xs" hx-post="{% if own %}{% url 'people:my_avatar' %}{% else %}{% url 'people:avatar_change' p.id %}{% endif %}"
        hx-encoding="multipart/form-data" hx-target="#avatar-editor-{{ p.id }}" hx-swap="outerHTML">
    <label class="hj-btn default xs" style="cursor:pointer"><i class="ti ti-camera" aria-hidden="true"></i>{% if p.has_avatar %}Change photo{% else %}Add a photo{% endif %}
      <input type="file" name="file" accept="image/jpeg,image/png,image/webp" hidden data-square-jpeg="320" hx-post="{% if own %}{% url 'people:my_avatar' %}{% else %}{% url 'people:avatar_change' p.id %}{% endif %}"
             hx-encoding="multipart/form-data" hx-trigger="squared" hx-target="#avatar-editor-{{ p.id }}" hx-swap="outerHTML"></label>
    {% if p.has_avatar %}<button type="submit" name="remove" value="1" class="hj-btn danger subtle xs"><i class="ti ti-trash" aria-hidden="true"></i>Remove</button>{% endif %}
  </form>
</div>
