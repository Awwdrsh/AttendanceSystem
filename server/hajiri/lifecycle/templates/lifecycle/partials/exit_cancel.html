<form class="hj-form" data-modal-title="Cancel this exit" hx-post="{% url 'lifecycle:exit_cancel' id %}" hx-swap="none" x-data="{ reason: '' }">
  <p class="hj-sm hj-muted" style="margin:0">The employee stays on. Their exit date is cleared and the clearance checklist closes.</p>
  <div class="hj-fieldset"><label class="hj-label">Reason</label><textarea name="reason" class="hj-input" rows="2" maxlength="500" x-model="reason"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Back</button><button type="submit" class="hj-btn danger" :disabled="reason.trim().length < 3">Cancel exit</button></div>
</form>
