<form class="hj-form" data-modal-title="Record an exit" data-modal-size="lg" hx-post="{% url 'lifecycle:exit_new' %}" hx-swap="none"
      {% confirm_attrs "The employee's exit date becomes the last working day. They can sign in until then, and the exit clearance checklist starts now." title="Record this exit?" label="Record exit" %}
      x-data="{ kind: 'resignation', voluntary: true, lwd: '' }" @change="lwd = $el.querySelector('input[name=lastWorkingDay]').value"
      :hx-confirm="'The employee\'s exit date becomes ' + (lwd ? Hajiri.bs.fmt(lwd) : 'the last working day') + '. They can sign in until then, and the exit clearance checklist starts now.'">
  {% employee_picker "employee_id" required=True %}
  <div class="hj-form-row">
    <div class="hj-fieldset"><label class="hj-label">Type</label><select name="kind" class="hj-select" x-model="kind" @change="voluntary = (kind === 'resignation' || kind === 'retirement')">
      {% for k, l in kinds %}<option value="{{ k }}">{{ l }}</option>{% endfor %}</select></div>
    {% bs_date_input "lastWorkingDay" label="Last working day" required=True %}
    <div class="hj-fieldset"><label class="hj-label">Main reason</label><select name="reasonCategory" class="hj-select"><option value=""></option>{% for r in reasons %}<option>{{ r }}</option>{% endfor %}</select></div>
    <label class="hj-row nowrap hj-gap-sm"><input type="checkbox" class="hj-switch" name="voluntary" x-model="voluntary"><span class="hj-sm">Voluntary (the employee chose to leave)</span></label>
  </div>
  <div class="hj-fieldset"><label class="hj-label">Notes</label><textarea name="reason" class="hj-input" rows="2" maxlength="2000"></textarea></div>
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Record exit</button></div>
</form>
