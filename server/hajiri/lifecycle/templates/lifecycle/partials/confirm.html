<form class="hj-form" data-modal-title="Confirm {{ e.name_en }}" hx-post="{% url 'lifecycle:confirm' e.id %}" hx-swap="none">
  <p class="hj-sm hj-muted" style="margin:0">Records the confirmation directly, without a manager review.</p>
  {% bs_date_input "confirmedOn" value=e.probation_end label="Confirmed from" required=True %}
  <div class="hj-modal-foot"><button type="button" class="hj-btn default" data-modal-close>Cancel</button><button type="submit" class="hj-btn">Confirm employment</button></div>
</form>
