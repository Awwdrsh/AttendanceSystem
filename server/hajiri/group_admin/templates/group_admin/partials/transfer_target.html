{% if target %}
  <div class="hj-form-row" style="--cols:2">
    <div class="hj-fieldset"><label class="hj-label" for="f-branch_id">Branch in {{ target.company.name }}</label>
      <select name="branch_id" id="f-branch_id" class="hj-select"><option value="">None</option>{% for o in target.branches %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}</select></div>
    <div class="hj-fieldset"><label class="hj-label" for="f-org_unit_id">Department</label>
      <select name="org_unit_id" id="f-org_unit_id" class="hj-select"><option value="">None</option>{% for o in target.orgUnits %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}</select></div>
    <div class="hj-fieldset"><label class="hj-label" for="f-manager_id">Manager</label>
      <select name="manager_id" id="f-manager_id" class="hj-select"><option value="">None</option>{% for o in target.managers %}<option value="{{ o.id }}">{{ o.name }} ({{ o.code }})</option>{% endfor %}</select></div>
    <div class="hj-fieldset"><label class="hj-label" for="f-shift_id">Shift</label>
      <select name="shift_id" id="f-shift_id" class="hj-select"><option value="">The company's default</option>{% for o in target.shifts %}<option value="{{ o.id }}">{{ o.name }}</option>{% endfor %}</select></div>
  </div>
  {% if target.company.carryLeaveBalance %}
    <div class="hj-fieldset"><label class="hj-check-row" for="f-carry_leave"><input type="checkbox" class="hj-check" name="carry_leave" id="f-carry_leave" value="on"><span><span class="hj-label">Carry the leave balance over</span><span class="hj-help" style="display:block;margin-top:2px">Balances of leave types {{ target.company.name }} also has move with the person and are taken off here.</span></span></label></div>
  {% else %}
    <p class="hj-help">{{ target.company.name }} does not carry leave balances over on transfer; the balance here is settled with the exit.</p>
  {% endif %}
{% else %}
  <p class="hj-help">Choose the company to see its branches, departments, managers and shifts.</p>
{% endif %}
