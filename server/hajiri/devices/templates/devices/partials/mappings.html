<div id="device-mappings-{{ d.id }}" hx-get="{% url 'devices:mappings' d.id %}" hx-trigger="hj:refresh-device-mappings from:body" hx-swap="outerHTML">
{% if mappings %}
<div class="hj-table-wrap"><div class="hj-table-scroll" style="max-height:260px"><table class="hj-table">
  <thead><tr><th>PIN</th><th>Employee</th><th>Valid</th></tr></thead>
  <tbody>
  {% for m in mappings %}<tr><td class="mono">{{ m.device_user_pin }}</td><td><div class="hj-sm hj-strong">{{ m.name_en }}</div><div class="hj-small hj-muted">{{ m.emp_code }}</div></td><td class="muted">{{ m.valid_label }}</td></tr>{% endfor %}
  </tbody>
</table></div></div>
{% else %}{% empty_state title="No PIN mappings yet" hint="Map a PIN to link punches from this terminal to an employee." compact=True %}{% endif %}
</div>
