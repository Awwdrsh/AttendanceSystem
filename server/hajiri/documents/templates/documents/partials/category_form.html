<form class="hj-form" data-modal-title="New document type" data-modal-size="sm" hx-post="{% url 'documents:category_new' %}" hx-swap="none"
      x-data="{ name: '', code: '', slug(s) { return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) } }">
  <div class="hj-fieldset">
    <label class="hj-label" for="ct-name">Name <span class="req">*</span></label>
    <input id="ct-name" class="hj-input" name="name" maxlength="80" required placeholder="e.g. Work permit"
           :value="name" @input="const v = $event.target.value; code = code && code !== slug(name) ? code : slug(v); name = v">
  </div>
  <div class="hj-fieldset">
    <label class="hj-label" for="ct-code">Code <span class="req">*</span></label>
    <input id="ct-code" class="hj-input mono" name="code" maxlength="40" required :value="code" @input="code = slug($event.target.value)">
  </div>
  <label class="hj-check-row"><input type="checkbox" class="hj-switch" name="employee_can_upload" value="1" checked> Employees can upload it</label>
  <label class="hj-check-row"><input type="checkbox" class="hj-switch" name="expiry_required" value="1"> Needs an expiry date</label>
  <label class="hj-check-row"><input type="checkbox" class="hj-switch" name="visible_to_employee" value="1" checked> Visible to the employee</label>
  <div class="hj-modal-foot">
    <button type="button" class="hj-btn default" data-modal-close>Cancel</button>
    <button type="submit" class="hj-btn" :disabled="!name.trim() || !/^[a-z0-9_]{2,40}$/.test(code)">Add</button>
  </div>
</form>
