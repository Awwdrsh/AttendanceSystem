# The Django stack with Docker (alternative to scripts/setup-django.sh on a machine that has Docker).
#   cp infra/docker-django/env.example infra/docker-django/.env        # fill the secrets
#   docker compose -f infra/docker-compose.django.yml --env-file infra/docker-django/.env up -d --build
# On every start the web container applies migrations and idempotent seeds, and creates the admin user named in
# HAJIRI_ADMIN_EMAIL / HAJIRI_ADMIN_PASSWORD if it does not exist yet. The worker and the gateway start once the web
# container is healthy (so the schema is in place). Web app: http://<host>:3000, terminals: http://<host>:8080/iclock
x-app: &app
  build: { context: .., dockerfile: infra/docker-django/Dockerfile }
  image: hajiri-django:latest
  restart: unless-stopped
x-env: &env
  DATABASE_URL: postgres://hajiri:${POSTGRES_PASSWORD}@postgres:5432/hajiri
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?set DATA_ENCRYPTION_KEY}
  PASSWORD_PEPPER: ${PASSWORD_PEPPER:?set PASSWORD_PEPPER}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
  LOG_LEVEL: info
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hajiri
      POSTGRES_USER: hajiri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U hajiri -d hajiri"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  web:
    <<: *app
    command: ["web"]
    environment:
      <<: *env
      HAJIRI_SERVICE: web
      PORT: "3000"
      RUN_WORKER: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COMPANY_CODE: ${COMPANY_CODE:-DEMO}
      COMPANY_NAME: ${COMPANY_NAME:-}
      HAJIRI_ADMIN_EMAIL: ${HAJIRI_ADMIN_EMAIL:-}
      HAJIRI_ADMIN_PASSWORD: ${HAJIRI_ADMIN_PASSWORD:-}
    ports: ["3000:3000"]
    depends_on: { postgres: { condition: service_healthy } }
  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *env
      HAJIRI_SERVICE: worker
    depends_on:
      postgres: { condition: service_healthy }
      web: { condition: service_healthy }     # migrations are applied by the web container first
  gateway:
    <<: *app
    command: ["gateway"]
    environment:
      <<: *env
      HAJIRI_SERVICE: gateway
      GATEWAY_PORT: "8080"
      GATEWAY_SIGNING_KEY: ${GATEWAY_SIGNING_KEY:?set GATEWAY_SIGNING_KEY}
      GATEWAY_MAX_PENDING_DEVICES: ${GATEWAY_MAX_PENDING_DEVICES:-50}
      GATEWAY_MAX_CLOCK_SKEW_MIN: ${GATEWAY_MAX_CLOCK_SKEW_MIN:-10}
      GATEWAY_RAW_DIR: /app/server/data/raw
      GATEWAY_ALLOW_DANGEROUS_COMMANDS: "false"
    ports: ["8080:8080"]
    volumes: ["gateway-raw:/app/server/data"]
    depends_on:
      postgres: { condition: service_healthy }
      web: { condition: service_healthy }
volumes:
  pgdata:
  gateway-raw:
