# Local infrastructure for when Docker is available (plan §8.4). Today's dev setup uses Homebrew PostgreSQL 18 on :5433 instead.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hajiri
      POSTGRES_USER: hajiri
      POSTGRES_PASSWORD: hajiri
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
  valkey:
    image: valkey/valkey:9
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hajiri
      MINIO_ROOT_PASSWORD: hajiri-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio:/data"]
volumes:
  pgdata:
  minio:
