        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: sort
        schema:
          enum:
          - name
          - code
          - company
          - joined
          - -joined
          type: string
          default: name
          minLength: 1
        description: |-
