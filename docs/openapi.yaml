components:
  schemas:
    AccessInRequest:
      type: object
      description: Give or change a person's access to one company of the group.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 200
        companyId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRoleEnum'
          minItems: 1
        employeeId:
          type: string
          format: uuid
          nullable: true
      required:
      - companyId
      - email
      - roles
    AccrualBasisEnum:
      enum:
      - none
      - worked_days
      - monthly
      - annual
      type: string
      description: |-
        * `none` - none
        * `worked_days` - worked_days
        * `monthly` - monthly
        * `annual` - annual
    ActivityInRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        projectId:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    AdjustInKindEnum:
      enum:
      - adjustment
      - allocation
      - carry_forward
      type: string
      description: |-
        * `adjustment` - adjustment
        * `allocation` - allocation
        * `carry_forward` - carry_forward
    AdjustInRequest:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        deltaDays:
          type: number
        reason:
          type: string
          minLength: 3
          maxLength: 500
        effectiveDate:
          type: string
          format: date
        kind:
          allOf:
          - $ref: '#/components/schemas/AdjustInKindEnum'
          default: adjustment
      required:
      - deltaDays
      - employeeId
      - leaveTypeId
      - reason
    ApplyCitInRequest:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        monthlyCit:
          type: string
          minLength: 1
          pattern: ^-?\d{1,12}(\.\d{1,2})?$
        fromBsMonth:
          type: integer
          maximum: 12
          minimum: 1
      required:
      - employeeId
      - monthlyCit
    ApplyInRequest:
      type: object
      description: 'zod `.strict()`: keys the schema does not know are refused (''Unrecognized
        key: "x"'').'
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 1
          pattern: ^[0-9+\- ()]{6,30}$
        experienceYears:
          type: number
          nullable: true
        currentEmployer:
          type: string
          nullable: true
          maxLength: 120
        coverNote:
          type: string
          nullable: true
          maxLength: 4000
        answers:
          type: object
          additionalProperties: {}
        cvFilename:
          type: string
          minLength: 1
          maxLength: 200
        cvDataUrl:
          type: string
          minLength: 20
          maxLength: 6000000
        consent:
          type: boolean
        source:
          allOf:
          - $ref: '#/components/schemas/ApplyInSourceEnum'
          default: careers
        website:
          type: string
          maxLength: 200
      required:
      - consent
      - cvDataUrl
      - cvFilename
      - email
      - name
      - phone
    ApplyInSourceEnum:
      enum:
      - careers
      - job_board
      - referral
      - other
      type: string
      description: |-
        * `careers` - careers
        * `job_board` - job_board
        * `referral` - referral
        * `other` - other
    ApplyPenaltiesInRequest:
      type: object
      properties:
        bsYear:
          type: integer
          maximum: 2100
          minimum: 2000
        bsMonth:
          type: integer
          maximum: 12
          minimum: 1
        employeeIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 2000
      required:
      - bsMonth
      - bsYear
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - pending
        * `approved` - approved
        * `rejected` - rejected
        * `cancelled` - cancelled
    ApproveRejectEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    AssignInRequest:
      type: object
      description: '`from` is a Python keyword and cannot be a class attribute: subclasses
        list such fields in `keyword_fields`.'
      properties:
        employeeId:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        from:
          type: string
          format: date
      required:
      - employeeId
      - from
      - shiftId
    AssignmentInRequest:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        structureVersionId:
          type: string
          format: uuid
        baseAmounts:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            pattern: ^-?\d{1,12}(\.\d{1,2})?$
        from:
          type: string
          format: date
      required:
      - baseAmounts
      - employeeId
      - from
      - structureVersionId
    AttachInRequest:
      type: object
      properties:
        companyId:
          type: string
          format: uuid
      required:
      - companyId
    AttachmentInRequest:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
      required:
      - fileId
    AttendanceUploadInRequest:
      type: object
      properties:
        csv:
          type: string
          minLength: 1
          maxLength: 1000000
        filename:
          type: string
          maxLength: 200
      required:
      - csv
    AudienceEnum:
      enum:
      - all
      - branch
      - department
      type: string
      description: |-
        * `all` - all
        * `branch` - branch
        * `department` - department
    BillInKindEnum:
      enum:
      - transport
      - lodging
      - other
      type: string
      description: |-
        * `transport` - transport
        * `lodging` - lodging
        * `other` - other
    BillInRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/BillInKindEnum'
        billDate:
          type: string
          format: date
        description:
          type: string
          minLength: 1
          maxLength: 300
        amount:
          type: string
          minLength: 1
          pattern: ^\d{1,10}(\.\d{1,2})?$
