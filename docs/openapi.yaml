        name: export
        schema:
          enum:
          - people
          - breakdowns
          type: string
          default: people
          minLength: 1
        description: |-
          * `people` - people
          * `breakdowns` - breakdowns
      - in: query
        name: format
        schema:
          enum:
          - json
          - csv
