openapi: 3.0.3
info:
  title: Hajiri API
  version: '1'
  description: Attendance, HR and payroll. JSON endpoints for terminals, kiosk tablets
    and integrations.
paths:
  /_/files/:
    post:
      operationId: __files_create
      summary: Upload a file to attach to a form
      tags:
      - _
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadInRequest'
        required: true
      security:
      - session: []
        bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFileOut'
          description: ''
  /_/files/{file_id}:
    get:
      operationId: __files_retrieve
      summary: Open an upload not attached yet
      parameters:
      - in: path
        name: file_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - _
      security:
      - session: []
        bearer: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /_/regularisation/offline:
    post:
      operationId: __regularisation_offline_create
      description: |-
        /_/regularisation/offline (app.js data-offline-flush-url): one clock-in queued while offline. 201 when filed,
        4xx {"error"} to drop it with that message.
      tags:
      - _
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineClockInRequest'
          application/x-www-form-urlencoded:
            schema:
