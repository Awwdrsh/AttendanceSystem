components:
  schemas:
    AccessInRequest:
      type: object
      description: Give or change a person's access to one company of the group.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 200
        companyId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRoleEnum'
          minItems: 1
        employeeId:
          type: string
          format: uuid
          nullable: true
      required:
      - companyId
      - email
      - roles
    AccrualBasisEnum:
      enum:
      - none
      - worked_days
      - monthly
      - annual
      type: string
      description: |-
        * `none` - none
        * `worked_days` - worked_days
        * `monthly` - monthly
        * `annual` - annual
    AcknowledgeInRequest:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 2000
    ActivateInRequest:
      type: object
      properties:
        branchId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 120
    ActivityInRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        projectId:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    AddTaskInRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          nullable: true
          maxLength: 1000
        department:
          type: string
          nullable: true
          maxLength: 60
        assigneeType:
          $ref: '#/components/schemas/AssigneeTypeEnum'
        assigneeUserId:
          type: string
          format: uuid
          nullable: true
        dueDate:
          type: string
          format: date
          nullable: true
        link:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          pattern: ^/[A-Za-z0-9/_?=&-]*$
      required:
      - assigneeType
      - title
    AdhocDefinitionInRequest:
      type: object
      description: 'zod `.strict()`: keys the schema does not know are refused (''Unrecognized
        key: "x"'').'
      properties:
        dataset:
          type: string
        columns:
          type: array
          items:
            type: string
          maxItems: 30
          minItems: 1
        filters:
          type: array
          items:
            $ref: '#/components/schemas/FilterInRequest'
          maxItems: 15
        sort:
          allOf:
          - $ref: '#/components/schemas/SortInRequest'
          nullable: true
        includeExited:
          type: boolean
          default: false
      required:
      - columns
      - dataset
    AdjustInKindEnum:
      enum:
      - adjustment
      - allocation
      - carry_forward
      type: string
      description: |-
        * `adjustment` - adjustment
        * `allocation` - allocation
        * `carry_forward` - carry_forward
    AdjustInRequest:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        leaveTypeId:
          type: string
          format: uuid
        deltaDays:
          type: number
        reason:
          type: string
          minLength: 3
          maxLength: 500
        effectiveDate:
          type: string
          format: date
        kind:
          allOf:
          - $ref: '#/components/schemas/AdjustInKindEnum'
          default: adjustment
      required:
      - deltaDays
      - employeeId
      - leaveTypeId
      - reason
    AnswerFeedbackInRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        privateToManager:
          type: boolean
          default: false
      required:
      - body
    AnswerInRequest:
      type: object
      properties:
        questionId:
          type: string
          format: uuid
        answer:
          type: string
      required:
      - answer
      - questionId
    AppealDecisionInOutcomeEnum:
      enum:
      - decision_upheld
      - decision_changed
      type: string
      description: |-
        * `decision_upheld` - decision_upheld
        * `decision_changed` - decision_changed
    AppealDecisionInRequest:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/AppealDecisionInOutcomeEnum'
        note:
          type: string
          minLength: 1
          maxLength: 4000
        newOutcome:
          $ref: '#/components/schemas/NewOutcomeEnum'
      required:
      - note
      - outcome
    AppealInRequest:
      type: object
      properties:
        reason:
