          * `csv` - csv
      - in: query
        name: from
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: groupBy
        schema:
          enum:
          - project
          - client
          - employee
          - activity
          - day
          type: string
          default: project
          minLength: 1
        description: |-
          * `project` - project
          * `client` - client
          * `employee` - employee
          * `activity` - activity
          * `day` - day
